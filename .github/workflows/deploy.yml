name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Prepare build files for GitHub Pages
        run: |
          mkdir -p ./public_out

          # 1. Copy the static build output
          if [ -d .output/public ]; then
            cp -r .output/public/. ./public_out/
          elif [ -d dist ]; then
            cp -r dist/. ./public_out/
          else
            echo "ERROR: no build output found (.output/public or dist)"
            exit 1
          fi

          # 2. Fall back to the app shell if prerendering produced none
          if [ ! -f ./public_out/index.html ] && [ -f ./public_out/_shell.html ]; then
            cp ./public_out/_shell.html ./public_out/index.html
          fi

          # 3. Custom domain + disable Jekyll (needed for _-prefixed folders)
          echo "piotrkazimierski.pl" > ./public_out/CNAME
          touch ./public_out/.nojekyll

          # 4. SPA fallback for deep links
          if [ -f ./public_out/index.html ]; then
            cp ./public_out/index.html ./public_out/404.html
          else
            echo "ERROR: index.html missing from build output!"
            exit 1
          fi

          echo "Prepared static bundle in ./public_out:"
          ls -la ./public_out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
