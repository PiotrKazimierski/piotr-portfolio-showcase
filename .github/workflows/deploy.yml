name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Prepare build artifacts
        run: |
          mkdir -p ./public_out
          if [ -d ".output/public" ]; then
            echo "Found .output/public"
            cp -r .output/public/* ./public_out/
          elif [ -d "dist" ]; then
            echo "Found dist"
            cp -r dist/* ./public_out/
          else
            echo "Error: No build directory found!"
            exit 1
          fi
          
          # Generowanie 404.html dla obsługi routingu SPA w GitHub Pages
          if [ -f "./public_out/index.html" ] && [ ! -f "./public_out/404.html" ]; then
            cp ./public_out/index.html ./public_out/404.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
