name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Prepare build artifacts
        run: |
          mkdir -p ./public_out
          
          # Szukamy skompilowanego pliku index.html
          INDEX_FILE=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "./index.html" | head -n 1)
          
          if [ -z "$INDEX_FILE" ]; then
            echo "BŁĄD: Nie znaleziono skompilowanego index.html!"
            exit 1
          fi
          
          BUILD_DIR=$(dirname "$INDEX_FILE")
          echo "Znaleziono skompilowany projekt w: $BUILD_DIR"
          
          cp -r $BUILD_DIR/* ./public_out/
          echo "piotrkazimierski.pl" > ./public_out/CNAME
          cp ./public_out/index.html ./public_out/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
