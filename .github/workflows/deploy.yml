name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Prepare build files for GitHub Pages
        run: |
          mkdir -p ./public_out

          # 1. Wybierz folder z wybudowaną aplikacją (.output/public dla TanStack Start lub dist dla Vite)
          BUILD_DIR=""
          if [ -d .output/public ]; then
            BUILD_DIR=".output/public"
          elif [ -d dist ]; then
            BUILD_DIR="dist"
          else
            echo "BŁĄD: Nie znaleziono folderu z wybudowaną aplikacją!"
            exit 1
          fi

          # 2. Skopiuj wygenerowane pliki
          cp -r $BUILD_DIR/* ./public_out/

          # 3. Jeśli TanStack wygenerował skompilowany _shell.html, użyj go jako index.html
          if [ -f ./public_out/_shell.html ]; then
            cp ./public_out/_shell.html ./public_out/index.html
          fi

          # 4. Ustawienie własnej domeny oraz obsługa odświeżania podstron (404.html)
          echo "piotrkazimierski.pl" > ./public_out/CNAME
          cp ./public_out/index.html ./public_out/404.html

          # 5. Weryfikacja
          if [ ! -f ./public_out/index.html ]; then
            echo "BŁĄD: Nie znaleziono pliku index.html ani _shell.html!"
            exit 1
          fi

          echo "Pomyślnie przygotowano paczkę! Zawartość ./public_out:"
          ls -la ./public_out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
